receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}
  # Claude Code는 메트릭을 delta temporality로 내보내는데, prometheus_remote_write
  # exporter는 delta counter를 (에러 없이) 버린다. cumulative로 변환해야 저장된다.
  delta_to_cumulative: {}

exporters:
  prometheus_remote_write:
    endpoint: http://victoriametrics:8428/api/v1/write
    # host.name, os.user, member 같은 리소스 속성을 메트릭 라벨로 변환 (핵심 설정)
    resource_to_telemetry_conversion:
      enabled: true
  otlp_http/victorialogs:
    logs_endpoint: http://victorialogs:9428/insert/opentelemetry/v1/logs

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [delta_to_cumulative, batch]
      exporters: [prometheus_remote_write]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/victorialogs]
